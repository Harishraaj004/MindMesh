# Optional: Postgres + pgvector in Docker (instead of a local install).
# docker compose up -d   ->   MINDMESH_DATABASE_URL=postgresql://postgres:postgres@localhost:5440/mindmesh
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindmesh
    ports: ["5440:5432"]
    volumes: ["mindmesh_pg:/var/lib/postgresql/data"]
volumes:
  mindmesh_pg:
