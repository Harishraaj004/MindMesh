<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindMesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4fa;--panel:rgba(255,255,255,.7);--solid:#fff;--raise:#f7f8fc;--ink:#131726;--ink2:#3a4157;--mut:#6b7389;
  --line:rgba(20,24,38,.08);--line2:rgba(20,24,38,.15);
  --acc:#6a58ff;--acc2:#0fb5d1;--grad:linear-gradient(135deg,#6a58ff 0%,#0fb5d1 100%);--soft:rgba(106,88,255,.1);
  --amber:#e8930c;--ok:#0ea371;--bad:#e5484d;
  --shadow:0 1px 2px rgba(16,20,40,.04),0 10px 30px -12px rgba(16,20,40,.16);
  --b1:rgba(106,88,255,.2);--b2:rgba(15,181,209,.16);--b3:rgba(232,147,12,.09);--grid:rgba(20,24,38,.035);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--disp:"Space Grotesk",Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#080a11;--panel:rgba(17,20,31,.68);--solid:#121624;--raise:#181d2d;--ink:#e9ecf6;--ink2:#c2c8da;--mut:#8890a7;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);
  --acc:#8d7dff;--acc2:#22d3ee;--grad:linear-gradient(135deg,#8d7dff 0%,#22d3ee 100%);--soft:rgba(141,125,255,.14);
  --amber:#f5a524;--ok:#34d399;--bad:#fb7185;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 40px -16px rgba(0,0,0,.7);
  --b1:rgba(124,92,255,.24);--b2:rgba(34,211,238,.13);--b3:rgba(245,165,36,.06);--grid:rgba(255,255,255,.028);
}}
:root[data-theme=dark]{
  --bg:#080a11;--panel:rgba(17,20,31,.68);--solid:#121624;--raise:#181d2d;--ink:#e9ecf6;--ink2:#c2c8da;--mut:#8890a7;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);
  --acc:#8d7dff;--acc2:#22d3ee;--grad:linear-gradient(135deg,#8d7dff 0%,#22d3ee 100%);--soft:rgba(141,125,255,.14);
  --amber:#f5a524;--ok:#34d399;--bad:#fb7185;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 40px -16px rgba(0,0,0,.7);
  --b1:rgba(124,92,255,.24);--b2:rgba(34,211,238,.13);--b3:rgba(245,165,36,.06);--grid:rgba(255,255,255,.028);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--soft)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.hide{display:none!important}

/* ambient background */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 28s ease-in-out infinite alternate}
.blob.a{width:620px;height:620px;background:var(--b1);top:-220px;left:12%}
.blob.b{width:520px;height:520px;background:var(--b2);bottom:-200px;right:6%;animation-delay:-9s}
.blob.c{width:420px;height:420px;background:var(--b3);top:40%;left:-120px;animation-delay:-17s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.08)}100%{transform:translate(-40px,70px) scale(.95)}}

/* header */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px -6px var(--acc)}
.logo svg{width:20px;height:20px}
.brand h1{font:700 18px/1 var(--disp);margin:0;letter-spacing:-.01em}
.pills{display:flex;gap:6px;margin-left:6px;min-width:0;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2.4s infinite}
.dot.warn{background:var(--amber)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}80%,100%{box-shadow:0 0 0 7px transparent}}
.tabs{position:relative;display:flex;gap:2px;margin:0 auto;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--mut);padding:6px 14px;border-radius:9px;font-weight:500;white-space:nowrap;transition:color .2s}
.tabs button svg{width:16px;height:16px}
.tabs button.on{color:#fff}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--grad);box-shadow:0 6px 16px -6px var(--acc);transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.hbtns{display:flex;gap:6px}
.ib{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink2);transition:all .15s}
.ib:hover{color:var(--acc);border-color:var(--line2);transform:translateY(-1px)}
.mob{display:none}

/* layout */
main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 370px;min-height:0}
.panel{background:var(--panel);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);overflow:auto;min-height:0}
#side-l{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:18px}
#side-r{border-left:1px solid var(--line);display:flex;flex-direction:column}
#center{position:relative;min-height:0;display:flex;flex-direction:column}
.lbl{display:flex;align-items:center;gap:8px;white-space:nowrap;font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 10px}
.lbl .cnt{background:var(--soft);color:var(--acc);border-radius:999px;padding:2px 7px;letter-spacing:0}
.lbl .sp{flex:1}

/* inputs */
.drop{position:relative;border:1.5px dashed var(--line2);border-radius:var(--r,14px);padding:20px 14px;text-align:center;color:var(--mut);cursor:pointer;transition:all .2s;background:var(--raise);overflow:hidden}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--ink2);background:var(--soft)}
.drop.over{transform:scale(1.015)}
.drop .up{width:42px;height:42px;margin:0 auto 8px;border-radius:12px;display:grid;place-items:center;background:var(--solid);border:1px solid var(--line);color:var(--acc);transition:transform .25s}
.drop:hover .up,.drop.over .up{transform:translateY(-3px)}
.drop b{color:var(--ink);font-weight:600}
.drop .fm{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:10px}
.drop .fm span{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--solid)}
.drop.busy::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--grad);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.field{display:flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 10px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;padding:5px 0}
.field>svg{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:7px 14px;font-weight:600;background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px var(--acc);transition:transform .15s,box-shadow .15s,opacity .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px var(--acc)}
.btn:disabled{opacity:.55;transform:none;cursor:default}
.btn.ghost{background:none;color:var(--acc);box-shadow:none;border:1px solid var(--line2);padding:4px 10px;font-size:12px}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 11px;font-size:12.5px}

/* documents */
#docs{display:flex;flex-direction:column;gap:4px}
.doc{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid transparent;transition:background .15s,border-color .15s;animation:rise .35s both;animation-delay:var(--d,0ms)}
.doc:hover{background:var(--raise);border-color:var(--line)}
.kic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.kic svg{width:16px;height:16px}
.kic.sm{width:24px;height:24px;border-radius:7px}.kic.sm svg{width:13px;height:13px}
.k-pdf{--c:#ef4444}.k-word{--c:#3b82f6}.k-image{--c:#ec4899}.k-code{--c:#10b981}.k-table{--c:#14b8a6}.k-web{--c:#8b5cf6}.k-text{--c:#94a3b8}
.dm{flex:1;min-width:0}
.dm .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm .s{font-size:11.5px;color:var(--mut)}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.doc:hover .acts,.doc:focus-within .acts{opacity:1}
.acts button{border:0;background:none;color:var(--mut);width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.acts button svg{width:15px;height:15px}
.acts button:hover{background:var(--solid);color:var(--ink)}
.acts .del.confirm{background:var(--bad);color:#fff;width:auto;padding:0 8px;font-size:11.5px;font-weight:600}
.acts button.spin svg{animation:rot 1s linear infinite}
.nodocs{color:var(--mut);font-size:13px;text-align:center;padding:18px 10px;border:1px dashed var(--line);border-radius:12px}
.sk{height:48px;border-radius:12px;background:linear-gradient(90deg,var(--raise),var(--line),var(--raise));background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}

/* chat */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
#scroll{flex:1;overflow:auto;padding:24px 20px 8px;scroll-behavior:smooth}
#chat{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;padding:6vh 10px 10px;animation:rise .5s both}
.orb{width:92px;height:92px;margin:0 auto 22px;position:relative}
.orb svg{width:100%;height:100%;overflow:visible}
.orb .ln{stroke:var(--acc);stroke-width:1.4;opacity:.5;stroke-dasharray:4 4;animation:dash 6s linear infinite}
.orb .nd{fill:var(--acc2)}
.orb .nd.m{fill:var(--acc)}
.orb .nd.p{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.orb .nd.p:nth-of-type(2n){animation-delay:-1.3s}
.orb::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,var(--b1),transparent 70%);filter:blur(10px)}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes pulse{50%{transform:scale(1.35)}}
.hero h2{font:700 clamp(24px,3.4vw,34px)/1.15 var(--disp);margin:0 0 10px;letter-spacing:-.02em}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:520px;margin:0 auto 22px}
.sugg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;max-width:720px;margin:0 auto;text-align:left}
.sugg button{display:flex;gap:10px;align-items:flex-start;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink2);transition:all .2s;animation:rise .5s both;animation-delay:var(--d)}
.sugg button:hover{border-color:var(--acc);color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow)}
.sugg button svg{color:var(--acc);margin-top:2px}
.hero .cta{margin-top:18px}

.msg{animation:rise .35s both}
.msg.q{align-self:flex-end;max-width:78%;background:var(--grad);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;box-shadow:0 10px 24px -14px var(--acc);white-space:pre-wrap}
.msg.a{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:16px 18px;box-shadow:var(--shadow)}
.a-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12.5px;color:var(--mut)}
.a-head .av{width:24px;height:24px;border-radius:7px;background:var(--grad);display:grid;place-items:center}
.a-head .av svg{width:14px;height:14px}
.a-head b{color:var(--ink);font-weight:600}
.a-head .sp{flex:1}
.ans{white-space:pre-wrap;font-size:14.5px;line-height:1.7}
.ans.typing::after{content:"";display:inline-block;width:7px;height:16px;background:var(--acc);margin-left:2px;vertical-align:-3px;border-radius:2px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cite{display:inline-flex;align-items:center;background:var(--soft);color:var(--acc);border-radius:6px;padding:0 6px;font:600 11.5px/1.6 var(--mono);cursor:pointer;vertical-align:1px;transition:all .15s;border:0}
.cite:hover,.cite.on{background:var(--acc);color:#fff}
.a-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.meter{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:3px 10px 3px 4px;border-radius:999px;background:var(--raise);border:1px solid var(--line)}
.meter svg{width:24px;height:24px;transform:rotate(-90deg)}
.meter circle{fill:none;stroke-width:3.5}
.meter .tr{stroke:var(--line2)}
.meter .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--ink2);background:var(--raise)}
.chip svg{width:13px;height:13px}
.chip.br{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.trace{margin-top:10px}
.trace summary{cursor:pointer;color:var(--mut);font-size:12.5px;list-style:none;display:inline-flex;align-items:center;gap:6px;user-select:none}
.trace summary::-webkit-details-marker{display:none}
.trace summary svg{width:14px;height:14px;transition:transform .2s}
.trace[open] summary svg{transform:rotate(90deg)}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 12px 24px;font-size:13px;color:var(--ink2);animation:rise .3s both;animation-delay:var(--d)}
.tl li::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:1.5px;background:var(--line2)}
.tl li:last-child::before{display:none}
.tl li i{position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--acc);background:var(--solid)}
.tl li.warn i{border-color:var(--bad)}
.tl li b{font-weight:600;color:var(--ink);text-transform:capitalize;margin-right:6px}
.tl .sub{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.tl .sub span{font:12px/1.5 var(--mono);color:var(--mut)}
.vis{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--raise)}
.vis img,.vis svg{display:block;width:100%;height:auto}
.vis small{display:block;padding:6px 10px;color:var(--mut);font-size:11.5px}

.think{display:flex;flex-direction:column;gap:12px}
.pipe{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.pipe .st{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);transition:color .3s}
.pipe .st span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);background:var(--solid);transition:all .3s}
.pipe .st span svg{width:12px;height:12px}
.pipe .st.on{color:var(--ink)}
.pipe .st.on span{border-color:var(--acc);box-shadow:0 0 0 4px var(--soft);animation:pulse 1.4s ease-in-out infinite}
.pipe .st.done{color:var(--ink2)}
.pipe .st.done span{background:var(--grad);border-color:transparent;color:#fff}
.pipe .bar{width:26px;height:1.5px;background:var(--line2);margin:0 8px;position:relative;overflow:hidden}
.pipe .bar.done{background:var(--acc)}
.lines{display:flex;flex-direction:column;gap:8px}
.lines div{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--raise),var(--line2),var(--raise));background-size:200% 100%;animation:shim 1.4s infinite}

/* composer */
.composer{padding:10px 20px 18px;position:relative}
.composer::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:30px;background:linear-gradient(transparent,var(--bg));pointer-events:none;opacity:.8}
.cbox{max-width:860px;margin:0 auto;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:10px 10px 8px 16px;transition:border-color .2s,box-shadow .2s}
.cbox:focus-within{border-color:var(--acc);box-shadow:var(--shadow),0 0 0 4px var(--soft)}
.cbox textarea{width:100%;border:0;outline:0;background:none;resize:none;max-height:200px;padding:4px 0;line-height:1.55;font-size:14.5px}
.ctools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:4px 28px 4px 30px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;outline:0}
.sel select:focus{border-color:var(--acc)}
.sel select option{background:var(--solid);color:var(--ink)}
.sel>svg{position:absolute;pointer-events:none;width:14px;height:14px;color:var(--acc)}
.sel>svg:first-child{left:10px}.sel>svg:last-child{right:9px;color:var(--mut)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:30px;height:18px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(12px)}
.kbd{margin-left:auto;font-size:11.5px;color:var(--mut)}
.kbd kbd{font:500 10.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--raise)}
.send{width:38px;height:38px;border-radius:12px;padding:0}
.send svg{width:18px;height:18px}
.send.busy svg{animation:rot 1s linear infinite}

/* sources panel */
.rh{padding:16px 16px 10px;display:flex;align-items:center}
.rb{padding:0 16px 16px;flex:1}
.src{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--raise);transition:border-color .2s,box-shadow .2s,opacity .2s,transform .2s;animation:rise .35s both;animation-delay:var(--d)}
.src.dim{opacity:.62}
.src.dim:hover{opacity:1}
.src.hl,.src.peek{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.src.hl{animation:rise .35s both,flash 1.2s .1s}
@keyframes flash{30%{box-shadow:0 0 0 7px var(--soft)}}
.sh{display:flex;align-items:center;gap:8px}
.sh .sn{flex:1;min-width:0}
.sh .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .s{font-size:11.5px;color:var(--mut)}
.rel{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--mut)}
.rel div{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.rel div i{display:block;height:100%;border-radius:4px;background:var(--grad);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.src pre{white-space:pre-wrap;word-break:break-word;margin:10px 0 0;font:12px/1.6 var(--mono);color:var(--ink2);max-height:150px;overflow:hidden;position:relative;mask-image:linear-gradient(#000 70%,transparent)}
.src.open pre{max-height:none;mask-image:none}
.src .more{border:0;background:none;color:var(--acc);font-size:12px;font-weight:500;padding:4px 0 0}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tags span{font-size:10.5px;border-radius:6px;padding:1px 7px;background:var(--solid);border:1px solid var(--line);color:var(--mut)}
.tags span.c{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
img.thumb{max-width:100%;max-height:190px;border-radius:9px;margin-top:10px;display:block;border:1px solid var(--line)}
.pempty{text-align:center;color:var(--mut);padding:40px 16px}
.pempty .ic{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);color:var(--acc)}
.pempty .ic svg{width:22px;height:22px}
.pempty b{display:block;color:var(--ink);margin-bottom:4px}

/* graph */
#v-graph{position:relative;padding:14px}
#gwrap{position:relative;flex:1;border-radius:18px;border:1px solid var(--line);background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}#cv.pt{cursor:pointer}
.gtop{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.gtop>*{pointer-events:auto}
.gtop .field{background:var(--solid);width:240px;box-shadow:var(--shadow)}
.stat{display:flex;gap:4px}
.stat span{background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12px;color:var(--mut);box-shadow:var(--shadow)}
.stat b{color:var(--ink);font-family:var(--disp)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:70%;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:11.5px;color:var(--ink2);box-shadow:var(--shadow)}
.legend span{display:inline-flex;align-items:center;gap:6px;text-transform:capitalize}
.legend i{width:9px;height:9px;border-radius:50%}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom .ib{background:var(--solid);box-shadow:var(--shadow)}
.tip{position:absolute;pointer-events:none;background:var(--solid);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow);max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;z-index:3}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip small{color:var(--mut)}
.gempty{position:absolute;inset:0;display:grid;place-items:center}
.node-card{animation:rise .3s both}
.node-card h4{font:700 20px/1.2 var(--disp);margin:6px 0 8px;word-break:break-word}
.typ{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;text-transform:capitalize;border-radius:999px;padding:2px 9px;background:var(--raise);border:1px solid var(--line);color:var(--ink2)}
.typ i{width:8px;height:8px;border-radius:50%}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kv div{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px}
.kv b{display:block;font:700 20px/1.1 var(--disp)}
.kv small{color:var(--mut);font-size:11.5px}
.lst{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.lst button,.lst div{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--ink2);transition:all .15s;animation:rise .3s both;animation-delay:var(--d)}
.lst button:hover{border-color:var(--acc);color:var(--ink)}
.lst .x{margin-left:auto;font-size:11px;color:var(--mut);white-space:nowrap}
.lst i{width:8px;height:8px;border-radius:50%;flex:none}

/* eval */
#v-eval{overflow:auto;padding:22px 20px}
.ew{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ehead{display:flex;align-items:center;gap:16px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);flex-wrap:wrap}
.ehead h2{font:700 20px/1.2 var(--disp);margin:0 0 3px}
.ehead p{margin:0;color:var(--mut);font-size:13px}
.ehead .sp{flex:1}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mc{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);animation:rise .4s both;animation-delay:var(--d)}
.mc h3{margin:0;font:600 14px var(--disp);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mc h3 small{font:500 11px var(--sans);color:var(--mut)}
.mc p{margin:2px 0 12px;color:var(--mut);font-size:12px}
.mrow{display:grid;grid-template-columns:100px 1fr 46px;gap:10px;align-items:center;font-size:12.5px;margin-top:7px}
.mrow .t{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.mrow .t i{display:block;height:100%;border-radius:6px;background:var(--c,var(--grad));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.mrow.best .t i{background:var(--grad)}
.mrow .v{text-align:right;font:500 12px var(--mono)}
.mrow.best .v{color:var(--acc);font-weight:700}
.mrow:not(.best) .t i{background:color-mix(in srgb,var(--mut) 45%,transparent)}
.note{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);background:color-mix(in srgb,var(--amber) 8%,transparent);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:14px;padding:12px 14px}
.note svg{color:var(--amber);margin-top:1px}
.gl dt{font-weight:600;font-size:13px;margin-top:12px}
.gl dd{margin:2px 0 0;color:var(--mut);font-size:12.5px}

/* toasts */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--solid);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;max-width:min(560px,90vw);animation:tin .35s cubic-bezier(.3,1.4,.5,1) both}
.toast.out{animation:tout .25s forwards}
.toast .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.toast .ti svg{width:13px;height:13px}
.toast.ok .ti{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.toast.err .ti{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.toast.load .ti{color:var(--acc)}
.toast.load .ti svg{animation:rot .9s linear infinite}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(8px) scale(.97)}}

.scrim{display:none}
.btn.ghost{white-space:nowrap}
@media(max-width:1180px){
  main{grid-template-columns:280px minmax(0,1fr)}
  .pill{max-width:170px}
  #side-r{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:20;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:var(--solid)}
  body.r-open #side-r{transform:none;box-shadow:var(--shadow)}
  .mob.r{display:grid}
}
@media(max-width:1060px){#st-emb{display:none}}
@media(max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  #side-l{position:fixed;top:0;left:0;bottom:0;width:min(320px,88vw);z-index:20;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:var(--solid)}
  body.l-open #side-l{transform:none;box-shadow:var(--shadow)}
  .mob.l{display:grid}
  .pills,.brand h1,.kbd{display:none}
  .tabs button span{display:none}
  .tabs button{padding:6px 12px}
  header{padding:8px 12px;gap:8px}
  #scroll{padding:16px 16px 8px}.composer{padding:8px 16px 14px}
  .msg.q{max-width:90%}
  .gtop .field{width:100%}
}
body.l-open .scrim,body.r-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="ambient"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

<header>
  <button class="ib mob l" id="tgl-l" title="Knowledge base"></button>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M6 7l6-3 6 3M6 7v10l6 3 6-3V7M6 7l6 4 6-4M12 11v9" opacity=".9"/><circle cx="12" cy="11" r="1.8" fill="#fff"/></svg></div>
    <h1>MindMesh</h1>
    <div class="pills"><span class="pill" id="st-llm"><i class="dot"></i>—</span><span class="pill" id="st-emb">—</span></div>
  </div>
  <nav class="tabs" id="tabs"><i class="ind"></i>
    <button class="on" data-t="chat"></button><button data-t="graph"></button><button data-t="eval"></button>
  </nav>
  <div class="hbtns"><button class="ib" id="theme" title="Toggle theme"></button><button class="ib mob r" id="tgl-r" title="Side panel"></button></div>
</header>

<main>
<aside class="panel" id="side-l">
  <div>
    <div class="lbl">Add knowledge</div>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload files">
      <div class="up" id="drop-ic"></div>
      <div><b>Drop files</b> or click to browse</div>
      <div class="fm"><span>PDF</span><span>DOCX</span><span>Images</span><span>Code</span><span>CSV</span><span>Text</span></div>
      <input type="file" id="file" multiple hidden>
    </div>
  </div>
  <div>
    <div class="lbl">Web link</div>
    <div class="field"><span id="link-ic"></span><input type="text" id="url" placeholder="https://…" aria-label="Web link URL"><button class="btn sm" id="addurl">Add</button></div>
  </div>
  <div style="flex:1;min-height:0">
    <div class="lbl">Knowledge base <span class="cnt" id="doccount">0</span><span class="sp"></span><button class="btn ghost" id="samples">Load samples</button></div>
    <div id="docs"><div class="sk"></div><div class="sk" style="opacity:.6"></div></div>
  </div>
</aside>

<section id="center">
  <div class="view" id="v-chat">
    <div id="scroll"><div id="chat"></div></div>
    <div class="composer"><div class="cbox">
      <textarea id="q" rows="1" placeholder="Ask anything across your knowledge base…" aria-label="Question"></textarea>
      <div class="ctools">
        <label class="sel" title="Retrieval mode"><span id="mode-ic"></span><select id="mode" aria-label="Retrieval mode"><option value="hybrid_graph">Hybrid + graph</option><option value="hybrid">Hybrid</option><option value="vector">Vector</option><option value="bm25">BM25</option></select><span id="chev-ic"></span></label>
        <label class="sw"><input type="checkbox" id="vis"><i></i>Visual explanation</label>
        <span class="kbd"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
        <button class="btn send" id="go" title="Ask"></button>

    </div></div>
  </div>

  <div class="view hide" id="v-graph">

      <canvas id="cv"></canvas>
      <div class="gtop">
        <div class="field"><span id="find-ic"></span><input type="text" id="gfind" placeholder="Find an entity…" aria-label="Find entity"></div>
        <div class="stat" id="gstat"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="zoom"><button class="ib" id="zin" title="Zoom in"></button><button class="ib" id="zout" title="Zoom out"></button><button class="ib" id="zfit" title="Fit to view"></button></div>
      <div class="tip" id="tip"></div>

    </div>
  </div>

  <div class="view hide" id="v-eval"><div class="ew">
    <div class="ehead">
      <div><h2>Retrieval evaluation</h2><p id="evmeta">Compare vector, BM25, hybrid and hybrid + graph on the labelled dataset.</p></div>
      <span class="sp"></span><button class="btn" id="runeval"></button>
    </div>
    <div id="evout"></div>
  </div></div>
</section>

<aside class="panel" id="side-r">
  <div class="rh"><div class="lbl" style="margin:0;flex:1" id="rtitle">Sources</div><button class="ib mob r" id="close-r" title="Close" style="width:30px;height:30px"></button></div>
  <div class="rb" id="p-chat"></div>
  <div class="rb hide" id="p-graph"></div>
  <div class="rb hide" id="p-eval"></div>
</aside>
</main>
<div class="scrim" id="scrim"></div>
<div id="toasts"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o){const r=await fetch('/api/'+p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
const post=(p,body)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

// ---- icons (inline, stroke-based)
const P={
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>',
  web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  upload:'<path d="M12 15V4m0 0-4 4m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  send:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  redo:'<path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/>',
  moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  graph:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8.4 6.5l7.2 1M6.8 8.4l2.4 7.2M16.4 10l-4.8 6"/>',
  chart:'<path d="M3 20h18M6 16v-5M11 16V6M16 16v-8M21 16v-3"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20v-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  bridge:'<path d="M4 18c0-6 4-10 8-10s8 4 8 10M2 18h20M8 18v-6M16 18v-6"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  chev:'<path d="m6 9 6 6 6-6"/>', right:'<path d="m9 6 6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  fit:'<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  loader:'<path d="M12 3a9 9 0 1 0 9 9"/>',
  play:'<path d="M6 4l14 8-14 8z"/>',
  plan:'<path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24">${P[n]||P.file}</svg>`;
const KIND_IC={pdf:'file',word:'file',image:'image',code:'code',table:'table',web:'web',text:'file'};
const KIND_LBL={pdf:'PDF',word:'Word',image:'Image',code:'Code',table:'Table',web:'Web page',text:'Text'};
const kic=(k,sm)=>`<span class="kic ${sm?'sm ':''}k-${KIND_IC[k]?k:'text'}">${ic(KIND_IC[k]||'file')}</span>`;
const MODE_LBL={hybrid_graph:'Hybrid + graph',hybrid:'Hybrid',vector:'Vector',bm25:'BM25'};

// static icons
$('#tgl-l').innerHTML=ic('menu');$('#tgl-r').innerHTML=ic('book');$('#close-r').innerHTML=ic('x');
$('#drop-ic').innerHTML=ic('upload');$('#link-ic').innerHTML=ic('link');$('#find-ic').innerHTML=ic('search');
$('#mode-ic').outerHTML=ic('layers');$('#chev-ic').outerHTML=ic('chev');
$('#go').innerHTML=ic('send');$('#zin').innerHTML=ic('plus');$('#zout').innerHTML=ic('minus');$('#zfit').innerHTML=ic('fit');
$('#runeval').innerHTML=ic('play')+'Run evaluation';
const TABS={chat:['chat','Ask'],graph:['graph','Knowledge graph'],eval:['chart','Evaluation']};
$$('#tabs button').forEach(b=>b.innerHTML=ic(TABS[b.dataset.t][0])+`<span>${TABS[b.dataset.t][1]}</span>`);

// ---- theme
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function setTheme(t){if(t)root.dataset.theme=t;$('#theme').innerHTML=ic(isDark()?'sun':'moon');if(G.nodes.length)G.colors=null}
try{const t=localStorage.getItem('mm-theme');if(t)root.dataset.theme=t}catch{}
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';setTheme(t);try{localStorage.setItem('mm-theme',t)}catch{}};

// ---- toasts
function toast(text,type='ok',ms=3800){
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=`<span class="ti">${ic(type==='ok'?'check':type==='err'?'alert':'loader')}</span><span class="tt">${esc(text)}</span>`;
  $('#toasts').append(t);
  const close=()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)};
  if(ms)setTimeout(close,ms);
  return {close,update(text,type){t.className='toast '+type;t.querySelector('.ti').innerHTML=ic(type==='ok'?'check':type==='err'?'alert':'loader');t.querySelector('.tt').textContent=text;if(type!=='load')setTimeout(close,type==='err'?7000:3800)}};
}

// ---- drawers (narrow screens)
const drawer=(side,open)=>document.body.classList.toggle(side+'-open',open);
$('#tgl-l').onclick=()=>drawer('l',!document.body.classList.contains('l-open'));
$('#tgl-r').onclick=()=>drawer('r',!document.body.classList.contains('r-open'));
$('#close-r').onclick=$('#scrim').onclick=()=>{drawer('l',false);drawer('r',false)};
const narrow=w=>innerWidth<=w;

// ---- knowledge base
let docCount=0;
async function refresh(){
  try{
    const [s,d]=await Promise.all([api('status'),api('documents')]);
    docCount=d.length;
    $('#st-llm').innerHTML=`<i class="dot ${s.llm_configured?'on':'warn'}"></i>${esc(s.llm)}`;
    $('#st-llm').title=s.llm_configured?'Chat model connected':'No chat model configured: extractive answers';
    $('#st-emb').innerHTML=ic('layers').replace('class="i"','class="i" style="width:13px;height:13px"')+esc(s.embedder);
    $('#doccount').textContent=d.length;
    $('#docs').innerHTML=d.map((x,i)=>`<div class="doc" style="--d:${i*35}ms">${kic(x.kind)}
      <div class="dm"><div class="n" title="${esc(x.name)}">${esc(x.name)}</div><div class="s">${KIND_LBL[x.kind]||esc(x.kind)} · ${x.n_chunks} chunk${x.n_chunks===1?'':'s'}</div></div>
      <div class="acts">${x.path?`<button data-re="${x.id}" title="Re-analyze with current settings">${ic('redo')}</button>`:''}<button class="del" data-id="${x.id}" title="Delete">${ic('trash')}</button></div></div>`).join('')
      ||`<div class="nodocs">Your knowledge base is empty.<br>Drop files above or load the samples.</div>`;
    if(!$('#chat .msg'))renderHero();
  }catch(e){$('#docs').innerHTML=`<div class="nodocs">Could not reach the server.<br><small>${esc(e.message)}</small></div>`}
}
$('#docs').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.id){
    if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='Delete?';setTimeout(()=>{if(b.isConnected){b.classList.remove('confirm');b.innerHTML=ic('trash')}},2600);return}
    b.closest('.doc').style.cssText='transition:all .25s;opacity:0;transform:translateX(-12px)';
    try{await api('documents/'+b.dataset.id,{method:'DELETE'});toast('Document removed')}catch(err){toast(err.message,'err')}
    refresh();
  }else if(b.dataset.re){
    b.classList.add('spin');const t=toast('Re-analyzing…','load',0);
    try{await api('documents/'+b.dataset.re+'/reindex',{method:'POST'});t.update('Re-analyzed with current settings','ok')}catch(err){t.update(err.message,'err')}
    refresh();
  }
};
async function upload(files){
  if(!files.length)return;
  const fd=new FormData();[...files].forEach(f=>fd.append('files',f));
  $('#drop').classList.add('busy');const t=toast(`Indexing ${files.length} file${files.length>1?'s':''}…`,'load',0);
  try{const r=await api('documents',{method:'POST',body:fd});
    t.update(`Added ${r.ingested.length} file${r.ingested.length===1?'':'s'}`+(r.errors.length?` · ${r.errors.map(e=>e.name+': '+e.error).join('; ')}`:''),r.errors.length?'err':'ok')}
  catch(e){t.update(e.message,'err')}
  $('#drop').classList.remove('busy');$('#file').value='';refresh();
}

$('#drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file').click()}};

let current=null,busy=false;
const scrollEnd=()=>{const s=$('#scroll');s.scrollTop=s.scrollHeight};
function relScores(list){const m=Math.max(...list.map(s=>s.score||0),1e-9);return Object.fromEntries(list.map(s=>[s.id,(s.score||0)/m]))}

function showSources(res,hl){
  current=res;
  $$('.cite.on').forEach(c=>c.classList.remove('on'));
  if(hl)$$(`.msg[data-r="${res.rid}"] .cite[data-s="${hl}"]`).forEach(c=>c.classList.add('on'));
  if(!res.sources.length){$('#p-chat').innerHTML=pempty('book','No sources','Nothing relevant was retrieved for this question.');return}
  const rel=relScores(res.sources),cited=new Set(res.cited);
  $('#p-chat').innerHTML=res.sources.map((s,i)=>`<div class="src ${hl===s.id?'hl':''} ${cited.has(s.id)?'':'dim'}" id="src-${s.id}" style="--d:${i*45}ms">
    <div class="sh"><button class="cite">${s.id}</button>${kic(s.kind,1)}<div class="sn"><div class="n" title="${esc(s.doc)}">${esc(s.doc)}</div><div class="s">${esc(s.loc)}</div></div></div>
    ${s.kind==='image'?`<img class="thumb" alt="" src="/api/documents/${s.doc_id}/annotated" onerror="this.onerror=null;this.src='/api/documents/${s.doc_id}/file'">`:''}
    <pre>${esc(s.text)}</pre>${s.text.length>320?'<button class="more">Show more</button>':''}
    <div class="rel">Relevance<div><i data-w="${Math.round(rel[s.id]*100)}"></i></div></div>
    <div class="tags">${cited.has(s.id)?'<span class="c">cited</span>':''}${(s.via||[]).map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>`).join('');
  requestAnimationFrame(()=>$$('#p-chat .rel i').forEach(i=>i.style.width=i.dataset.w+'%'));
  if(hl){const el=document.getElementById('src-'+hl);el?.scrollIntoView({block:'nearest',behavior:'smooth'})}
}
$('#p-chat').onclick=e=>{
  const m=e.target.closest('.more');if(m){const s=m.closest('.src');s.classList.toggle('open');m.textContent=s.classList.contains('open')?'Show less':'Show more';return}
  const c=e.target.closest('.src');if(c&&current)showSources(current,c.id.slice(4));

const pempty=(i,t,s)=>`<div class="pempty"><div class="ic">${ic(i)}</div><b>${t}</b>${s}</div>`;

const PIPE=[['plan','Plan'],['retrieve','Retrieve'],['graph','Graph'],['generate','Generate'],['verify','Verify']];
function thinking(){
  const d=document.createElement('div');d.className='msg a think';
  d.innerHTML=`<div class="a-head"><span class="av">${$('.logo').innerHTML}</span><b>MindMesh</b><span>is working…</span></div>
    <div class="pipe">${PIPE.map(([k,l],i)=>`${i?'<span class="bar"></span>':''}<div class="st" data-k="${k}"><span>${ic('check')}</span>${l}</div>`).join('')}</div>
    <div class="lines"><div style="width:92%"></div><div style="width:78%"></div><div style="width:55%"></div></div>`;
  const sts=[...d.querySelectorAll('.st')],bars=[...d.querySelectorAll('.bar')];let n=0;
  const adv=()=>{sts.forEach((s,i)=>{s.classList.toggle('done',i<n);s.classList.toggle('on',i===n)});bars.forEach((b,i)=>b.classList.toggle('done',i<n))};
  adv();const iv=setInterval(()=>{if(n<3){n++;adv()}},1100);
  return {el:d,stop:()=>clearInterval(iv)};
}

function typeInto(el,text,html){
  return new Promise(done=>{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.innerHTML=html;return done()}
    el.classList.add('typing');const total=text.length,dur=Math.min(1600,300+total*6),t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/dur),n=Math.floor(total*(1-Math.pow(1-k,2)));
      el.textContent=text.slice(0,n);if(k<1)requestAnimationFrame(f);else{el.classList.remove('typing');el.innerHTML=html;done()}})(t0);
  });
}

let rid=0;
async function render(res,holder){
  res.rid=++rid;
  const v=res.verification,checked=v.statements_checked,sup=v.statements_supported;
  const ok=!v.invalid_citations.length&&(v.support_rate===null||v.support_rate>=.8);
  const pct=checked?sup/checked:0,C=2*Math.PI*9;
  const meter=checked?`<span class="meter" style="--c:var(--${ok?'ok':'bad'})" title="Cited statements whose source text supports them"><svg viewBox="0 0 24 24"><circle class="tr" cx="12" cy="12" r="9"/><circle class="fg" cx="12" cy="12" r="9" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-o="${C*(1-pct)}"/></svg>${sup}/${checked} statements supported</span>`
    :`<span class="chip">${ic('shield')}No cited statements to verify</span>`;
  const chips=[meter];
  if(v.invalid_citations.length)chips.push(`<span class="chip bad">${ic('alert')}Invalid: ${esc(v.invalid_citations.join(', '))}</span>`);
  res.steps.filter(s=>s.step==='warn').forEach(s=>chips.push(`<span class="chip bad" title="${esc(s.detail)}">${ic('alert')}${esc(s.detail.slice(0,70))}${s.detail.length>70?'…':''}</span>`));
  res.bridges.forEach(x=>chips.push(`<span class="chip br" title="Shared by ${esc(x.docs.join(' + '))}">${ic('bridge')}${esc(x.entity)}</span>`));
  const sub=s=>{
    if(s.step==='plan'&&Array.isArray(s.data)&&s.data.length>1)return `<div class="sub">${s.data.map(q=>`<span>→ ${esc(q)}</span>`).join('')}</div>`;
    if(s.step==='graph'&&Array.isArray(s.data)&&s.data.length)return `<div class="sub">${s.data.slice(0,6).map(p=>`<span>${esc(p.from)} —${esc(p.relation)}→ ${esc(p.to)}</span>`).join('')}${s.data.length>6?`<span>+${s.data.length-6} more</span>`:''}</div>`;
    return '';
  };
  const steps=res.steps.map((s,i)=>`<li class="${s.step==='warn'?'warn':''}" style="--d:${i*50}ms"><i></i><b>${esc(s.step)}</b>${esc(s.detail)}${sub(s)}</li>`).join('');
  let vis='';
  if(res.visual)vis=res.visual.kind==='svg'?`<div class="vis">${res.visual.svg}</div>`
    :`<div class="vis"><img alt="Visual explanation" src="data:${res.visual.mime};base64,${res.visual.data}"><small>AI-generated illustration (${esc(res.visual.source)}); text inside it may be inaccurate, check the cited sources.</small></div>`;
  const d=document.createElement('div');d.className='msg a';d.dataset.r=res.rid;
  d.innerHTML=`<div class="a-head"><span class="av">${$('.logo').innerHTML}</span><b>MindMesh</b><span class="sp"></span><span>${MODE_LBL[res.mode]||''} · ${res.sources.length} source${res.sources.length===1?'':'s'}</span></div>
    <div class="ans"></div>${vis}<div class="a-foot">${chips.join('')}</div>
    <details class="trace"><summary>${ic('right')}Reasoning trace · ${res.steps.length} steps</summary><ol class="tl">${steps}</ol></details>`;
  holder.replaceWith(d);
  showSources(res,res.cited[0]);
  const html=esc(res.answer).replace(/\[S(\d+)\]/g,(m,n)=>`<button class="cite" data-s="S${n}">S${n}</button>`);
  requestAnimationFrame(()=>d.querySelectorAll('.meter .fg').forEach(c=>c.style.strokeDashoffset=c.dataset.o));
  await typeInto(d.querySelector('.ans'),res.answer.replace(/\[S\d+\]/g,''),html);
  d.onclick=e=>{const s=e.target.closest('.cite')?.dataset.s;if(s){showSources(res,s);if(narrow(1180))drawer('r',true)}};
  d.onmouseover=e=>{const s=e.target.closest('.cite')?.dataset.s;if(s&&current===res)document.getElementById('src-'+s)?.classList.add('peek')};
  d.onmouseout=e=>{const s=e.target.closest('.cite')?.dataset.s;if(s)document.getElementById('src-'+s)?.classList.remove('peek')};
}

async function ask(q){
  q=(q??$('#q').value).trim();if(!q||busy)return;
  if($('#v-chat').classList.contains('hide'))switchTab('chat');
  $('#q').value='';grow();$('.hero')?.remove();
  const qd=document.createElement('div');qd.className='msg q';qd.textContent=q;$('#chat').append(qd);
  const th=thinking();$('#chat').append(th.el);scrollEnd();
  busy=true;$('#go').disabled=true;$('#go').classList.add('busy');$('#go').innerHTML=ic('loader');
  const mode=$('#mode').value;
  try{const res=await post('ask',{question:q,mode,visual:$('#vis').checked});res.mode=mode;th.stop();await render(res,th.el)}
  catch(e){th.stop();const d=document.createElement('div');d.className='msg a';d.innerHTML=`<span class="chip bad">${ic('alert')}${esc(e.message)}</span>`;th.el.replaceWith(d)}
  busy=false;$('#go').disabled=false;$('#go').classList.remove('busy');$('#go').innerHTML=ic('send');scrollEnd();$('#q').focus();
}

// ---- knowledge graph: force layout on canvas, pan/zoom/drag, no dependencies
const PAL=['#8d7dff','#22d3ee','#34d399','#f472b6','#60a5fa','#a3e635','#fb7185','#c084fc','#2dd4bf','#facc15'];
const G={nodes:[],links:[],by:{},adj:{},types:{},k:1,tx:0,ty:0,alpha:0,hover:null,sel:null,drag:null,pan:null,filter:'',raf:0,W:0,H:0,dpr:1,colors:null,t:0,bridges:[]};
const cv=$('#cv'),ctx=cv.getContext('2d');
const tcol=t=>G.types[t]??(G.types[t]=PAL[Object.keys(G.types).length%PAL.length]);
const rad=n=>4+Math.min(10,Math.sqrt(n.mentions)*2.4);
function themeColors(){const cs=getComputedStyle(root);return {ink:cs.getPropertyValue('--ink').trim(),mut:cs.getPropertyValue('--mut').trim(),line:isDark()?'rgba(255,255,255,':'rgba(20,24,38,',amber:cs.getPropertyValue('--amber').trim(),acc:cs.getPropertyValue('--acc').trim(),solid:cs.getPropertyValue('--solid').trim()}}
function sizeCanvas(){const r=cv.getBoundingClientRect();G.dpr=devicePixelRatio||1;G.W=r.width;G.H=r.height;cv.width=r.width*G.dpr;cv.height=r.height*G.dpr}

async function loadGraph(){
  sizeCanvas();
  let g;try{g=await api('graph')}catch(e){toast(e.message,'err');return}
  G.types={};G.colors=null;G.sel=null;G.hover=null;G.bridges=g.bridges||[];
  const n0=g.nodes.length;
  G.nodes=g.nodes.map((n,i)=>{const a=i/n0*Math.PI*2,r=60+Math.random()*120;return {...n,x:Math.cos(a)*r,y:Math.sin(a)*r,vx:0,vy:0,c:tcol(n.type)}});
  G.by=Object.fromEntries(G.nodes.map(n=>[n.id,n]));G.adj={};
  G.links=g.links.filter(l=>G.by[l.source]&&G.by[l.target]).map(l=>{const o={...l,s:G.by[l.source],t:G.by[l.target]};
    (G.adj[l.source]??=[]).push([o.t,l.relation]);(G.adj[l.target]??=[]).push([o.s,l.relation]);return o});
  G.k=1;G.tx=G.W/2;G.ty=G.H/2;G.alpha=1;G.fitted=0;
  const bc=G.nodes.filter(n=>n.bridge).length;
  $('#gstat').innerHTML=`<span><b>${G.nodes.length}</b> entities</span><span><b>${G.links.length}</b> links</span><span style="color:var(--amber)"><b style="color:var(--amber)">${bc}</b> bridges</span>`;
  $('#legend').innerHTML=Object.entries(G.types).map(([t,c])=>`<span><i style="background:${c}"></i>${esc(t)}</span>`).join('')+`<span><i style="background:transparent;box-shadow:0 0 0 2px var(--amber)"></i>shared across docs</span>`;
  $('#legend').classList.toggle('hide',!G.nodes.length);$('#gstat').classList.toggle('hide',!G.nodes.length);
  $('#gempty').classList.toggle('hide',!!G.nodes.length);
  $('#gempty').innerHTML=pempty('graph','No entities yet','Add documents to see how they connect.');
  graphPanel();
  cancelAnimationFrame(G.raf);G.raf=requestAnimationFrame(frame);
}
function stopGraph(){cancelAnimationFrame(G.raf);G.raf=0}

function simulate(){
  const N=G.nodes,a=G.alpha;
  for(let i=0;i<N.length;i++){const p=N[i];
    for(let j=i+1;j<N.length;j++){const q=N[j];let dx=p.x-q.x,dy=p.y-q.y,d2=dx*dx+dy*dy+1;const f=420*a/d2;
      p.vx+=dx*f;p.vy+=dy*f;q.vx-=dx*f;q.vy-=dy*f}
    p.vx-=p.x*.02*a;p.vy-=p.y*.02*a}
  for(const l of G.links){const dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.hypot(dx,dy)||1,f=(d-60)*.05*a;
    l.s.vx+=dx/d*f;l.s.vy+=dy/d*f;l.t.vx-=dx/d*f;l.t.vy-=dy/d*f}
  for(const n of N){if(n===G.drag){n.vx=n.vy=0;continue}n.x+=(n.vx*=.55);n.y+=(n.vy*=.55)}
  G.alpha=Math.max(G.drag?.3:0,G.alpha*.985);
}
function fit(animate){
  if(!G.nodes.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const n of G.nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)}
  const pad=80,k=Math.max(.5,Math.min(2.2,Math.min((G.W-pad*2)/(x1-x0||1),(G.H-pad*2-40)/(y1-y0||1))));
  zoomTo(k,G.W/2-(x0+x1)/2*k,G.H/2-(y0+y1)/2*k,animate);
}
function zoomTo(k,tx,ty,animate){
  if(!animate){G.k=k;G.tx=tx;G.ty=ty;return}
  const s={k:G.k,tx:G.tx,ty:G.ty},t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/450),e=1-Math.pow(1-p,3);G.k=s.k+(k-s.k)*e;G.tx=s.tx+(tx-s.tx)*e;G.ty=s.ty+(ty-s.ty)*e;if(p<1)requestAnimationFrame(f)})(t0);
}
function frame(t){
  G.t=t;if(G.alpha>.002)simulate();
  if(G.fitted<1&&G.alpha<.3){G.fitted=1;fit(true)}
  if(G.fitted<2&&G.alpha<.03){G.fitted=2;fit(true)}
  draw();G.raf=requestAnimationFrame(frame);
}
function focusSet(){
  const f=G.sel||G.hover;if(!f)return null;
  const s=new Set([f.id]);(G.adj[f.id]||[]).forEach(([n])=>s.add(n.id));return s;
}
function draw(){
  const C=G.colors??=themeColors(),k=G.k;
  ctx.setTransform(G.dpr,0,0,G.dpr,0,0);ctx.clearRect(0,0,G.W,G.H);
  ctx.setTransform(G.dpr*k,0,0,G.dpr*k,G.dpr*G.tx,G.dpr*G.ty);
  const fs=focusSet(),q=G.filter,match=n=>!q||n.label.toLowerCase().includes(q);
  const f=G.sel||G.hover;
  for(const l of G.links){
    const on=fs&&(l.s===f||l.t===f),faded=(fs&&!on)||(q&&!(match(l.s)&&match(l.t)));
    ctx.lineWidth=(on?2:Math.min(2.5,.6+l.weight*.35))/Math.sqrt(k);
    if(on){const g=ctx.createLinearGradient(l.s.x,l.s.y,l.t.x,l.t.y);g.addColorStop(0,l.s.c);g.addColorStop(1,l.t.c);ctx.strokeStyle=g}
    else ctx.strokeStyle=C.line+(faded?.04:.16)+')';
    ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke();
  }
  const pulse=(Math.sin(G.t/500)+1)/2;
  for(const n of G.nodes){
    const r=rad(n),faded=(fs&&!fs.has(n.id))||(q&&!match(n));
    ctx.globalAlpha=faded?.18:1;
    if(n.bridge){ctx.beginPath();ctx.arc(n.x,n.y,r+4+pulse*3,0,7);ctx.fillStyle=C.amber+'22';ctx.fill();
      ctx.lineWidth=2/Math.sqrt(k);ctx.strokeStyle=C.amber;ctx.beginPath();ctx.arc(n.x,n.y,r+2.5,0,7);ctx.stroke()}
    if(n===f){ctx.shadowColor=n.c;ctx.shadowBlur=18}
    const g=ctx.createRadialGradient(n.x-r*.35,n.y-r*.35,r*.1,n.x,n.y,r);g.addColorStop(0,'#ffffffaa');g.addColorStop(.35,n.c);g.addColorStop(1,n.c);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();ctx.shadowBlur=0;
    if(n===G.sel){ctx.lineWidth=2.5/k;ctx.strokeStyle=C.ink;ctx.beginPath();ctx.arc(n.x,n.y,r+(n.bridge?6:3),0,7);ctx.stroke()}
    const show=!faded&&(k>1.1||n.bridge||n.mentions>2||(fs&&fs.has(n.id))||(q&&match(n)));
    if(show){const fz=12/k;ctx.font=`${n===f?600:500} ${fz}px Inter,system-ui,sans-serif`;ctx.textAlign='center';
      ctx.lineWidth=3/k;ctx.strokeStyle=C.solid;ctx.strokeText(n.label,n.x,n.y-r-(n.bridge?8:5));ctx.fillStyle=C.ink;ctx.fillText(n.label,n.x,n.y-r-(n.bridge?8:5))}
    ctx.globalAlpha=1;
  }
}
const world=(e)=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left-G.tx)/G.k,(e.clientY-r.top-G.ty)/G.k,e.clientX-r.left,e.clientY-r.top]};
function hit(x,y){let best=null,bd=1e9;for(const n of G.nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<rad(n)+6/G.k&&d<bd){bd=d;best=n}}return best}
cv.onpointerdown=e=>{
  const [x,y,sx,sy]=world(e),n=hit(x,y);cv.setPointerCapture(e.pointerId);
  if(n){G.drag=n;G.alpha=Math.max(G.alpha,.3)}else G.pan={sx,sy,tx:G.tx,ty:G.ty};
  G.down={sx,sy,n};cv.classList.add('drag');
};
cv.onpointermove=e=>{
  const [x,y,sx,sy]=world(e);
  if(G.drag){G.drag.x=x;G.drag.y=y;G.alpha=Math.max(G.alpha,.3);hideTip();return}
  if(G.pan){G.tx=G.pan.tx+sx-G.pan.sx;G.ty=G.pan.ty+sy-G.pan.sy;return}
  const n=hit(x,y);G.hover=n;cv.classList.toggle('pt',!!n);
  if(n){const t=$('#tip');t.innerHTML=`<b>${esc(n.label)}</b><small>${esc(n.type)} · ${n.mentions} mention${n.mentions===1?'':'s'}</small><div style="margin-top:4px;color:var(--ink2)">${n.docs.map(esc).join('<br>')}</div>`;
    const W=$('#gwrap').clientWidth;t.style.left=Math.min(sx+14,W-270)+'px';t.style.top=(sy+14)+'px';t.classList.add('on')}else hideTip();
};
const hideTip=()=>$('#tip').classList.remove('on');
cv.onpointerup=e=>{
  const [,,sx,sy]=world(e),d=G.down;cv.classList.remove('drag');
  if(d&&Math.hypot(sx-d.sx,sy-d.sy)<4){G.sel=d.n||null;graphPanel()}
  G.drag=null;G.pan=null;G.down=null;
};
cv.onpointerleave=()=>{G.hover=null;hideTip()};
cv.onwheel=e=>{e.preventDefault();const [,,sx,sy]=world(e),k=Math.max(.25,Math.min(4,G.k*Math.exp(-e.deltaY*.0015)));
  G.tx=sx-(sx-G.tx)*k/G.k;G.ty=sy-(sy-G.ty)*k/G.k;G.k=k};
const zc=f=>{const k=Math.max(.25,Math.min(4,G.k*f));zoomTo(k,G.W/2-(G.W/2-G.tx)*k/G.k,G.H/2-(G.H/2-G.ty)*k/G.k,true)};
$('#zin').onclick=()=>zc(1.3);$('#zout').onclick=()=>zc(1/1.3);$('#zfit').onclick=()=>fit(true);
$('#gfind').oninput=e=>{G.filter=e.target.value.trim().toLowerCase();const m=G.filter&&G.nodes.filter(n=>n.label.toLowerCase().includes(G.filter));
  if(m&&m.length===1){G.sel=m[0];graphPanel()}};
function focusNode(n){G.sel=n;graphPanel();const k=Math.max(G.k,1.4);zoomTo(k,G.W/2-n.x*k,G.H/2-n.y*k,true)}

function graphPanel(){
  const n=G.sel,p=$('#p-graph');
  if(!n){
    p.innerHTML=G.bridges.length?`<p style="color:var(--mut);font-size:13px;margin:0 0 12px">Bridges are entities that appear in more than one document. They are how MindMesh connects separate sources.</p>
      <div class="lbl">Cross-document bridges</div><div class="lst">${G.bridges.map((b,i)=>{const node=G.nodes.find(x=>x.label===b.entity);
        return `<button style="--d:${i*40}ms" data-b="${node?node.id:''}"><i style="background:var(--amber)"></i><span>${esc(b.entity)}</span><span class="x">${b.docs.length} docs</span></button>`}).join('')}</div>
      <p style="color:var(--mut);font-size:12px">Click any node to inspect it. Drag to rearrange, scroll to zoom.</p>`
      :pempty('graph','Explore the graph','Click a node to see where it appears and what it connects to.');
    p.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const x=G.by[b.dataset.b];if(x)focusNode(x)});
    return;
  }
  const nb=(G.adj[n.id]||[]).slice().sort((a,b)=>b[0].mentions-a[0].mentions);
  p.innerHTML=`<div class="node-card"><span class="typ"><i style="background:${n.c}"></i>${esc(n.type)}</span>
    <h4>${esc(n.label)}</h4>
    <div class="kv"><div><b>${n.mentions}</b><small>mentions</small></div><div><b>${n.docs.length}</b><small>document${n.docs.length===1?'':'s'}</small></div></div>
    ${n.bridge?`<div class="chip br" style="margin-bottom:14px">${ic('bridge')}Bridges ${n.docs.length} documents</div>`:''}
    <div class="lbl">Appears in</div><div class="lst">${n.docs.map((d,i)=>`<div style="--d:${i*40}ms">${ic('file')}<span>${esc(d)}</span></div>`).join('')}</div>
    ${nb.length?`<div class="lbl">Connected to</div><div class="lst">${nb.map(([m,rel],i)=>`<button style="--d:${i*30}ms" data-n="${esc(m.id)}"><i style="background:${m.c}"></i><span>${esc(m.label)}</span><span class="x">${esc(rel||'co-occurs')}</span></button>`).join('')}</div>`:''}
    <button class="btn" id="askn" style="width:100%">${ic('spark')}Ask about ${esc(n.label)}</button>
    <button class="btn ghost" id="clrn" style="width:100%;margin-top:8px;padding:7px">Clear selection</button></div>`;
  p.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>focusNode(G.by[b.dataset.n]));
  $('#askn').onclick=()=>{switchTab('chat');ask(`What do the sources say about ${n.label}, and how does it connect across documents?`)};
  $('#clrn').onclick=()=>{G.sel=null;graphPanel()};
  if(narrow(1180))drawer('r',true);
}

// ---- evaluation
const METRICS=[
  ['recall@k','Recall@k','Share of questions where an expected document was retrieved in the top k.'],
  ['mrr','MRR','Mean reciprocal rank of the first relevant passage. Higher means it shows up earlier.'],
  ['answer_accuracy','Answer accuracy','Share of expected facts present in the generated answer.'],
  ['citation_validity','Citation validity','Share of cited ids that exist in the retrieved context.'],
  ['citation_support','Citation support','Share of cited statements whose source text supports them (lexical check).'],
  ['abstention_correct','Abstention','Correctly declines to answer questions the corpus cannot answer.'],
];
$('#p-eval').innerHTML=`<dl class="gl">${METRICS.map(([,t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>
  <div class="note" style="margin-top:18px">${ic('alert')}<span>The bundled dataset is small (10 questions over 5 files), so recall saturates and modes may not separate. Treat it as a smoke test, not evidence.</span></div>`;
$('#evout').innerHTML=`<div class="mc" style="text-align:center;padding:40px">${pempty('chart','No results yet','Run the evaluation to compare retrieval modes side by side.')}</div>`;
const fmt=v=>v==null||isNaN(v)?'–':(+v<=1?Math.round(v*100)+'%':(+v).toFixed(2));
$('#runeval').onclick=async()=>{
  const b=$('#runeval');b.disabled=true;b.innerHTML=ic('loader').replace('class="i"','class="i" style="animation:rot 1s linear infinite"')+'Running…';
  $('#evout').innerHTML=`<div class="mgrid">${METRICS.map(()=>'<div class="sk" style="height:190px;border-radius:16px"></div>').join('')}</div>`;
  try{const r=await api('eval',{method:'POST'});
    $('#evmeta').textContent=`${r.n} questions · top-k = ${r.k} · ${Object.keys(r.results).length} retrieval modes`;
    const modes=Object.keys(r.results);
    $('#evout').innerHTML=`<div class="mgrid">${METRICS.map(([key,t,d],mi)=>{
      const vals=modes.map(m=>r.results[m].summary[key]),nums=vals.filter(v=>v!=null&&!isNaN(v)),best=nums.length?Math.max(...nums):null;
      return `<div class="mc" style="--d:${mi*60}ms"><h3>${t}<small>${best!=null?'best '+fmt(best):''}</small></h3><p>${d}</p>
        ${modes.map((m,i)=>{const v=vals[i],w=v==null||isNaN(v)?0:Math.min(1,+v)*100;return `<div class="mrow ${v!=null&&v===best?'best':''}"><span>${MODE_LBL[m]||esc(m)}</span><div class="t"><i data-w="${w}"></i></div><span class="v">${fmt(v)}</span></div>`}).join('')}</div>`}).join('')}</div>
      <div class="note">${ic('alert')}<span>Small datasets saturate quickly. Build a larger labelled set from your real corpus before drawing conclusions.</span></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>$$('#evout .t i').forEach(i=>i.style.width=i.dataset.w+'%')));
    toast('Evaluation complete');
  }catch(e){$('#evout').innerHTML='';$('#evmeta').textContent=e.message;toast(e.message,'err')}
  b.disabled=false;b.innerHTML=ic('play')+'Run again';
};

// ---- boot
setTheme();
$('#p-chat').innerHTML=pempty('book','Sources appear here','Cited passages for each answer show up in this panel. Click a citation to jump to it.');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTheme());
requestAnimationFrame(moveInd);document.fonts?.ready.then(moveInd);
renderHero();refresh();
</script>
</body>
